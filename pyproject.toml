[project]
name = "skylark-drones-bi-agent"
version = "1.0.0"
description = "Monday.com business intelligence dashboard for Skylark Drones"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
